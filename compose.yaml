volumes:
  db:
  redis:
  nextcloud:
    driver: local
    driver_opts:
      type: none
      device: /home/dockeruser/nextcloud/html
      o: bind
  certs:
  acme:
  vhost.d:
  html:
  dhparam:

networks:
  proxy-tier: