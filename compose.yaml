# adapted from 
# https://github.com/nextcloud/docker/blob/master/.examples/docker-compose/with-nginx-proxy/mariadb/apache/compose.yaml
secrets:
  db_root:
    file: creds/db_root
  db_user:
    file: creds/db_user
  nc_admin:
    file: creds/nc_admin

services:
  db:
    image: mariadb:10.11
    command: --transaction-isolation=READ-COMMITTED
    restart: always
    volumes:
      - db:/var/lib/mysql:Z
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    env_file:
      - db.env
    secrets:
      - db_root
      - db_user

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis:/data

  app:
    image: nextcloud:29.0.9-apache
    restart: always
    volumes:
      - nextcloud:/var/www/html:z
      # NOTE: The `volumes` config of the `cron` and `app` containers must match
    environment:
      - MYSQL_HOST=db
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD_FILE=/run/secrets/nc_admin
      - NEXTCLOUD_TRUSTED_DOMAINS=\* # Allow all origins
      - VIRTUAL_HOST=nextcloud.pembau.art
      - LETSENCRYPT_HOST=nextcloud.pembau.art
      - LETSENCRYPT_EMAIL=admin@pembau.art
    env_file:
      - db.env
    secrets:
      - db_user
      - nc_admin
    depends_on:
      - db
      - redis
      # Added proxy container dependency below. 
      # It is unclear on when or why it happens, but sometimes NC manages to start before the proxy 
      #  and it breaks for whatever weird reason resulting in the need of manual proxy container restart.
      - proxy
    networks:
      - proxy-tier
      - default

  cron:
    image: nextcloud:29.0.9-apache
    restart: always
    volumes:
      - nextcloud:/var/www/html:z
      # NOTE: The `volumes` config of the `cron` and `app` containers must match
    entrypoint: /cron.sh
    depends_on:
      - db
      - redis

  collabora:
    image: collabora/code
    restart: always
    environment:
      - TZ=Europe/Vienna
      - dictionaries=de_DE
      - server_name=collabora.nextcloud.pembau.art
      - "extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:ssl.sts.enabled=true"
      - VIRTUAL_HOST=collabora.nextcloud.pembau.art
      - LETSENCRYPT_HOST=collabora.nextcloud.pembau.art
      - LETSENCRYPT_EMAIL=admin@pembau.art
    networks:
      - proxy-tier
    cap_add:
      - MKNOD
    tty: true

  proxy:
    build: ./proxy
    restart: always
    ports:
      - 80:80
      - 443:443
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy"
    volumes:
      - certs:/etc/nginx/certs:ro,z
      - vhost.d:/etc/nginx/vhost.d:z
      - html:/usr/share/nginx/html:z
      - dhparam:/etc/nginx/dhparam:z
      - /var/run/docker.sock:/tmp/docker.sock:z,ro
    networks:
      - proxy-tier

  letsencrypt-companion:
    image: nginxproxy/acme-companion
    restart: always
    environment:
      - DEFAULT_EMAIL=admin@pembau.art
    volumes:
      - certs:/etc/nginx/certs:z
      - acme:/etc/acme.sh:z
      - vhost.d:/etc/nginx/vhost.d:z
      - html:/usr/share/nginx/html:z
      - /var/run/docker.sock:/var/run/docker.sock:z,ro
    networks:
      - proxy-tier
    depends_on:
      - proxy

